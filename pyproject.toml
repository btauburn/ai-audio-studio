[project]
name = "ai-audio-studio"
version = "0.1.0b1"
description = "A Windows-first multi-backend AI audio production studio built around IndexTTS2"
authors = [{ name = "TadashiJLU" }]
maintainers = [{ name = "TadashiJLU" }]
license = "Apache-2.0 AND LicenseRef-Bilibili-IndexTTS"
license-files = [
  "LICENSE",
  "LICENSES/*",
  "NOTICE.md",
  "THIRD_PARTY_NOTICES.md",
]
readme = "README.md"
keywords = [
  "text-to-speech",
  "audio-production",
  "podcast",
  "audiobook",
  "indextts2",
  "qwen3-tts",
  "cosyvoice3",
]
classifiers = [
  "Development Status :: 4 - Beta",

  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",

  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Speech",

  "Natural Language :: English",
  "Natural Language :: Chinese (Simplified)",

  "Programming Language :: Python :: 3",

  "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.11,<3.14"
dependencies = [
  # IMPORTANT: Always run `uv lock` or `uv lock --upgrade` to resolve dependencies
  # and update the lockfile after editing anything below.
  # WARNING: Ensure that you don't have a local `uv.toml` which overrides PyPI
  # while generating the lockfile: https://github.com/astral-sh/uv/issues/15741
  "accelerate==1.8.1",
  "cn2an==0.5.24",
  # 4.8.1 replaces the removed pkg_resources API with importlib.resources on
  # Windows while remaining within Faster-Whisper/WhisperX's supported range.
  "ctranslate2==4.8.2",
  "cython==3.0.12",
  "descript-audiotools==0.7.2",
  "einops>=0.8.1",
  "ffmpeg-python==0.2.0",
  "g2p-en==2.1.0",
  "jieba==0.42.1",
  "json5==0.10.0",
  "librosa==0.10.2.post1",
  "matplotlib==3.10.9",
  "modelscope==1.27.1",
  "munch==4.0.0",
  "numba>=0.60,<0.62",
  "numpy>=2.0.2,<2.1.0; python_version < '3.13'",
  "numpy>=2.1.0,<2.3.0; python_version >= '3.13'",
  "whisperx==3.7.4",
  "omegaconf>=2.3.0",
  "opencv-python==4.12.0.88",
  "pandas>=2.2.3,<2.3.0",
  "safetensors==0.5.3",
  "sentencepiece>=0.2.1",
  "tensorboard==2.20.0",
  "textstat>=0.7.10",
  "tokenizers==0.21.4",
  "torch==2.8.*",
  "torchaudio==2.8.*",
  "tqdm>=4.67.1",
  "transformers==4.52.4",

  # Use "wetext" on Windows/Mac, otherwise "WeTextProcessing" on Linux.
  "wetext>=0.0.9; sys_platform != 'linux'",
  "WeTextProcessing; sys_platform == 'linux'",
]

[project.optional-dependencies]
# To install the WebUI support, use `uv sync --extra webui` (or `--all-extras`).
webui = [
  "gradio==6.16.0",
]
# To install the DeepSpeed support, use `uv sync --extra deepspeed` (or `--all-extras`).
# deepspeed = [
#   "deepspeed==0.17.1",
# ]
# To install the API/MCP service support, use `uv sync --extra api` (or `--all-extras`).
api = [
  "fastapi==0.135.4",
  "httpx>=0.24.0",
  "keyring==25.7.0",
  "uvicorn[standard]>=0.24.0",
  "python-multipart==0.0.32",
  "pydantic>=2.0.0",
  "starlette==1.3.1",
  "faster-whisper>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/tadashijlu/ai-audio-studio"
Repository = "https://github.com/tadashijlu/ai-audio-studio.git"
Upstream = "https://github.com/index-tts/index-tts"

[project.scripts]
# Set the installed binary names and entry points.
indextts = "indextts.cli:main"

[dependency-groups]
dev = [
  "pytest==9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [
  ".git",
  ".venv*",
  "cosyvoice",
  "environments",
  "models",
]
addopts = "-ra"

[build-system]
# How to build the project as a CLI tool or PyPI package.
# NOTE: Use `uv tool install -e .` to install the package as a CLI tool.
requires = ["hatchling >= 1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indextts", "dubbing_service"]

[tool.uv]
# Disable build isolation when building DeepSpeed from source.
# NOTE: This is *necessary* so that DeepSpeed builds directly within our `.venv`,
# and finds our CUDA-enabled version of PyTorch, which DeepSpeed *needs* during
# its compilation to determine what GPU support to compile for itself. It also
# saves time, since it won't waste time downloading a generic PyTorch version.
no-build-isolation-package = ["deepspeed"]

[tool.uv.sources]
# Install PyTorch with CUDA support on Linux/Windows (CUDA doesn't exist for Mac).
# NOTE: We must explicitly request them as `dependencies` above. These improved
# versions will not be selected if they're only third-party dependencies.
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
# Use PyTorch built for NVIDIA Toolkit version 12.9.
# Available versions: https://pytorch.org/get-started/locally/
url = "https://download.pytorch.org/whl/cu129"
# Only use this index when explicitly requested by `tool.uv.sources`.
explicit = true
