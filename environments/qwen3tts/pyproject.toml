[project]
name = "dubbing-qwen3tts-runtime"
version = "0.1.0"
description = "Reproducible runtime for Qwen3-TTS CustomVoice and VoiceDesign"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.3",
  "modelscope==1.35.4",
  "qwen-tts==0.1.1",
  "soundfile==0.13.1",
  "torch==2.10.0",
  "torchaudio==2.10.0",
  "uvicorn==0.44.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
