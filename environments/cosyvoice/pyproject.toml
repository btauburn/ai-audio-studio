[project]
name = "dubbing-cosyvoice-runtime"
version = "0.1.0"
description = "Reproducible Windows runtime for the vendored CosyVoice3 engine"
requires-python = ">=3.10,<3.11"
dependencies = [
  "conformer==0.3.2",
  "fastapi==0.135.4",
  "hyperpyyaml==1.2.2",
  "inflect==7.3.1",
  "librosa==0.10.2",
  "modelscope==1.27.0",
  "networkx==3.1",
  "numpy==1.26.4",
  "onnxruntime==1.18.0; sys_platform == 'win32' or sys_platform == 'darwin'",
  "openai-whisper==20231117",
  "omegaconf==2.3.0",
  "pydantic==2.12.5",
  "protobuf==5.29.6",
  "rich==13.7.1",
  "ruamel-yaml==0.18.16",
  "soundfile==0.12.1",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "transformers==4.51.3",
  "uvicorn==0.30.0",
  "wetext==0.0.4",
  "wget==3.2",
  "x-transformers==2.11.24",
]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
