[project]
name = "dubbing-stableaudio-runtime"
version = "0.1.0"
description = "Headless Stable Audio 3 Small-SFX worker runtime"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.135.4",
  "soundfile==0.13.1",
  "stable-audio-3",
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "uvicorn==0.44.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
stable-audio-3 = { git = "https://github.com/Stability-AI/stable-audio-3.git", rev = "a0b57f5483c4588f827f3552b7d5c6ca2a9687be" }
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
