name: Windows no-model CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-no-model-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source, locks, and offline tests
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DO_NOT_TRACK: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out source without model/media downloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.12.10 is the final CPython 3.12 release with an official Windows binary.
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Set up Node.js for JavaScript syntax checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install no-model test dependencies
        run: python -m pip install --disable-pip-version-check --requirement .github/requirements-ci.txt

      - name: Provide pinned FFmpeg for audio pipeline tests
        run: |
          $version = "9.0.1"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-$version-essentials_build.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "ffmpeg-$version"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$version/ffmpeg-$version-essentials_build.zip"
          curl.exe --fail --location --retry 3 --retry-all-errors --output $archive $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expectedSha256 = "fec81ae03971d9dd4be3ebe02e263bd2ec1d789483f931bdba5f5715e65da2e9"
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "FFmpeg archive SHA256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $bin = Join-Path $extractRoot "ffmpeg-$version-essentials_build\bin"
          if (-not (Test-Path -LiteralPath (Join-Path $bin "ffmpeg.exe") -PathType Leaf)) {
            throw "Pinned FFmpeg archive has an unexpected layout."
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify FFmpeg tools
        run: |
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Verify all uv lockfiles without resolving dependencies
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv lock --check --project environments/cosyvoice
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv lock --check --project environments/qwen3tts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv lock --check --project environments/stableaudio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify WebUI npm lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix dubbing_service/webui

      - name: Verify source export and repository boundaries
        run: |
          .\scripts\export_source.ps1 -ValidateOnly
          .\scripts\ci_source_guard.ps1

      - name: Check JavaScript syntax
        run: |
          $files = @(git -c core.quotepath=false ls-files "*.js" "*.mjs" "*.cjs")
          if ($LASTEXITCODE -ne 0) { throw "Unable to enumerate JavaScript files." }
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run fatal Python static checks
        run: >-
          ruff check dubbing_service service scripts tools tests
          --select E9,F63,F7
          --output-format github

      - name: Run offline no-model test suite
        run: >-
          python -m pytest tests
          --ignore=tests/test_indextts_audio_safety.py
          --ignore=tests/test_service_server_api.py
