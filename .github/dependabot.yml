version: 2
updates:
  # CosyVoice3 is updated manually because Dependabot's Linux updater cannot
  # resolve its Windows CUDA lock against the upstream Whisper/Triton markers.
  # The WebUI build tool is also manual: package metadata, precompiled CSS,
  # versioned vendor paths, checksums and notices must change together.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    # The root uv updater otherwise discovers vendored and separately managed
    # manifests and combines incompatible model-runtime upgrades into one PR.
    exclude-paths:
      - .github/**
      - archive/**
      - cosyvoice/**
      - environments/**
      - service/requirements.txt
    groups:
      root-python-patch:
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: uv
    directory: /environments/qwen3tts
    schedule:
      interval: weekly
      day: monday
      time: "09:10"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      qwen3tts-python-patch:
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      ci-patch:
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:45"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
