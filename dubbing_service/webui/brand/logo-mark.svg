<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">AI Audio Studio</title>
  <desc id="desc">Four audio tracks converge into a master waveform.</desc>
  <defs>
    <linearGradient id="panel" x1="8" y1="7" x2="57" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172033"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="signal" x1="11" y1="16" x2="55" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22c28f"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <g fill="none" stroke="url(#signal)" stroke-linecap="round" stroke-width="3">
    <path d="M12 17h9c5 0 7 3 11 10" opacity=".55"/>
    <path d="M12 27h11c4 0 6 2 9 5" opacity=".72"/>
    <path d="M12 37h11c4 0 6-2 9-5" opacity=".86"/>
    <path d="M12 47h9c5 0 7-3 11-10"/>
    <path d="M32 32h3l3-8 5 17 4-13 4 7h3" stroke-width="3.4"/>
  </g>
  <g fill="#d1fae5">
    <circle cx="12" cy="17" r="2" opacity=".55"/>
    <circle cx="12" cy="27" r="2" opacity=".72"/>
    <circle cx="12" cy="37" r="2" opacity=".86"/>
    <circle cx="12" cy="47" r="2"/>
  </g>
</svg>
