<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AI 有声工作室</title>
  <desc id="desc">A Windows-first studio for scripts, voices, takes, sound design, mastering, and publishing.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f1d30"/>
      <stop offset=".52" stop-color="#07111f"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1056 140) rotate(136) scale(500 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22c28f" stop-opacity=".22"/>
