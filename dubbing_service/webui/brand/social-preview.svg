    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="32" fill="url(#background)"/>
  <rect width="1280" height="640" rx="32" fill="url(#glow)"/>
  <path d="M0 510c224-70 383 44 582-22 180-60 316-185 698-107v259H0Z" fill="#0b1625" opacity=".66"/>

