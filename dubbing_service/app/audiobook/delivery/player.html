<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152823">
  <title>Audiobook review</title>
  <link rel="stylesheet" href="/assets/player.css">
  <script defer src="/assets/player.js"></script>
</head>
<body>
<main>
  <header><p class="eyebrow">YOUR LISTENING ROOM</p><h1 id="book">Audiobook review</h1><p id="summary" class="summary" role="status">Loading your chapters…</p><a href="/voice-lab" class="button secondary">Open Voice Lab</a></header>
  <div id="error" class="error" role="alert" hidden><p id="error-text"></p><button id="reload" type="button">Try again</button></div>
  <section id="chapters" aria-label="Chapters"></section>
  <section id="overall" class="card" hidden>
    <p class="eyebrow">THE BIG PICTURE</p><h2>Overall feedback</h2>
    <p class="hint">How does this batch sound? Your notes stay with this recording.</p>
    <form id="overall-form"><label class="sr-only" for="overall-text">Overall feedback</label><textarea id="overall-text" maxlength="4000" rows="4" placeholder="Voices, pacing, pronunciation…"></textarea><button type="submit">Save feedback</button><p id="overall-status" class="status" aria-live="polite"></p></form>
  </section>
  <details id="saved" class="card" hidden><summary>Saved feedback</summary><div id="saved-list"></div></details>
  <footer>Private listening · Your place is saved on this device.<br>Download a chapter to keep listening offline.</footer>
</main>
</body>
</html>
